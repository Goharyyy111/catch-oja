<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#334155,#0f172a 60%);color:white}
body{display:flex;justify-content:center;padding:14px}.app{width:min(620px,100%);text-align:center}
h1{margin:4px 0 2px;font-size:clamp(34px,8vw,56px);letter-spacing:-2px}.sub{opacity:.8;margin-bottom:12px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.card{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.14);border-radius:15px;padding:8px 4px}
.card b{display:block;font-size:22px}.card span{font-size:11px;opacity:.7}
.arena{position:relative;height:min(68vh,520px);min-height:400px;border-radius:24px;overflow:hidden;border:2px solid rgba(255,255,255,.16);background:linear-gradient(145deg,#1e293b,#111827);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.target{position:absolute;width:clamp(76px,22vw,118px);height:clamp(76px,22vw,118px);border-radius:50%;padding:5px;background:white;box-shadow:0 0 0 5px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.35);touch-action:manipulation;user-select:none;cursor:pointer;transition:left .12s ease-out,top .12s ease-out,transform .1s}
.target img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.target.hit{transform:scale(1.14)}
.combo{position:absolute;pointer-events:none;font-weight:900;font-size:25px;text-shadow:0 3px 10px #000;animation:float .65s ease-out forwards;z-index:4}
@keyframes float{to{transform:translateY(-60px) scale(1.2);opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;background:white;opacity:0;z-index:3}.flash.on{animation:flash .18s}
@keyframes flash{50%{opacity:.22}}
.controls{display:flex;gap:8px;margin-top:10px}
button{flex:1;border:0;border-radius:14px;padding:12px 10px;font-weight:800;font-size:15px;background:#fff;color:#111827;cursor:pointer}
button.secondary{background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.15)}
.overlay{position:absolute;inset:0;background:rgba(2,6,23,.84);display:flex;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(5px)}
.modal{width:min(88%,390px);background:#fff;color:#111827;border-radius:24px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.modal h2{font-size:34px;margin:0 0 8px}.modal p{margin:7px 0 18px}.hidden{display:none!important}
.bar{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:100%;background:#fff;transition:width .1s linear}
.badge{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px}
@media(max-width:430px){.arena{min-height:390px;height:62vh}.controls button{font-size:14px}}
</style></head>

<div class="overlay" id="startOverlay"><div class="modal"><h2>Ready? 👀</h2><p>Tap Oja before time runs out. Every 6 catches makes the game faster!</p><button id="startBtn">START GAME</button></div></div>
<div class="overlay hidden" id="gameOver"><div class="modal"><h2>Game Over 💥</h2><p id="message">Habeb den omy ❤️</p><p>Score: <b id="finalScore">0</b> · Best: <b id="finalBest">0</b></p><button id="againBtn">PLAY AGAIN</button></div></div></div>

<script>
const arena=document.getElementById('arena'),target=document.getElementById('target'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),missEl=document.getElementById('miss'),timerBar=document.getElementById('timerBar'),speedText=document.getElementById('speedText'),startOverlay=document.getElementById('startOverlay'),gameOver=document.getElementById('gameOver'),finalScore=document.getElementById('finalScore'),finalBest=document.getElementById('finalBest'),flash=document.getElementById('flash'),soundBtn=document.getElementById('soundBtn'),pauseBtn=document.getElementById('pauseBtn');
let score=0,misses=0,level=1,running=false,paused=false,timer=null,raf=null,deadline=0,sound=true,audioCtx=null,best=Number(localStorage.getItem('catchOjaBest')||0);bestEl.textContent=best;
function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function beep(freq,dur,type='sine',gain=.045){if(!sound)return;try{audio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function successSound(){beep(620,.07);setTimeout(()=>beep(880,.09),45)}function missSound(){beep(170,.18,'sawtooth',.035)}function levelSound(){beep(500,.08);setTimeout(()=>beep(700,.08),80);setTimeout(()=>beep(950,.12),160)}
function place(){const pad=8,r=target.getBoundingClientRect(),a=arena.getBoundingClientRect(),maxX=a.width-r.width-pad,maxY=a.height-r.height-pad;target.style.left=(pad+Math.random()*Math.max(1,maxX-pad))+'px';target.style.top=(pad+Math.random()*Math.max(1,maxY-pad))+'px'}
function limitMs(){return Math.max(650,1900-(level-1)*125)}
function updateSpeed(){const n=['Chill 😎','Quick ⚡','Fast 🔥','Insane 💨','OJA MODE 👹'];speedText.textContent='Speed: '+n[Math.min(n.length-1,level-1)]}
function scheduleMiss(){clearTimeout(timer);if(!running||paused)return;const ms=limitMs();deadline=performance.now()+ms;timer=setTimeout(()=>{if(running&&!paused){misses++;missEl.textContent=misses+'/3';missSound();if(misses>=3)endGame();else{place();scheduleMiss()}}},ms)}
function timerLoop(){cancelAnimationFrame(raf);const loop=()=>{if(running&&!paused){const left=Math.max(0,deadline-performance.now()),ms=limitMs();timerBar.style.width=(left/ms*100)+'%'}raf=requestAnimationFrame(loop)};loop()}
function pop(text,x,y){const d=document.createElement('div');d.className='combo';d.textContent=text;d.style.left=x+'px';d.style.top=y+'px';arena.appendChild(d);setTimeout(()=>d.remove(),700)}
function hit(e){if(!running||paused)return;e.preventDefault();audio();score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('catchOjaBest',best)}target.classList.add('hit');setTimeout(()=>target.classList.remove('hit'),100);flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');const r=target.getBoundingClientRect(),a=arena.getBoundingClientRect();pop(score%6===0?'LEVEL UP! 🔥':'+1',r.left-a.left+20,r.top-a.top+10);successSound();const nl=Math.floor(score/6)+1;if(nl!==level){level=nl;levelEl.textContent=level;levelSound();updateSpeed()}place();scheduleMiss()}
function start(){audio();score=0;misses=0;level=1;running=true;paused=false;scoreEl.textContent=0;missEl.textContent='0/3';levelEl.textContent=1;startOverlay.classList.add('hidden');gameOver.classList.add('hidden');pauseBtn.textContent='⏸ Pause';updateSpeed();place();scheduleMiss();timerLoop()}
function endGame(){running=false;paused=false;clearTimeout(timer);cancelAnimationFrame(raf);finalScore.textContent=score;finalBest.textContent=best;gameOver.classList.remove('hidden');beep(120,.35,'triangle',.05)}
function togglePause(){if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶ Resume':'⏸ Pause';if(paused)clearTimeout(timer);else scheduleMiss()}
target.addEventListener('pointerdown',hit);document.getElementById('startBtn').onclick=start;document.getElementById('againBtn').onclick=start;pauseBtn.onclick=togglePause;
soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊 Sound ON':'🔇 Sound OFF';if(sound)beep(700,.1)};
document.getElementById('shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Catch Oja ❤️',text:'I got '+score+' points in Catch Oja! Can you beat me? 😎',url:location.href});else await navigator.clipboard.writeText(location.href)}catch(e){}};
window.addEventListener('resize',()=>{if(running)place()});updateSpeed();place();
</script></body></html>
